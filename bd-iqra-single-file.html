function Avatar({ label, size = 40, t, ring }) {
  return (
    <div style={{ width: size, height: size, borderRadius: "50%", background: ring ? GRAD_GOLD(t) : "transparent", padding: ring ? 2 : 0, flexShrink: 0 }}>
      <div style={{ width: "100%", height: "100%", borderRadius: "50%", background: t.primary, color: "#F5F2E8", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: size * 0.38 }}>{label}</div>
    </div>
  );
}

function GradientHeader({ t, title, subtitle, icon: Icon, right, onBack, hidden }) {
  return (
    <div style={{
      background: GRAD(t),
      padding: hidden ? "0 18px" : "18px 18px 22px",
      maxHeight: hidden ? 0 : 220,
      opacity: hidden ? 0 : 1,
      borderRadius: "0 0 24px 24px",
      position: "relative",
      overflow: "hidden",
      flexShrink: 0,
      transition: "max-height 0.28s ease, padding 0.28s ease, opacity 0.2s ease"
    }}>
      <div style={{ position: "absolute", top: -30, right: -30, width: 120, height: 120, borderRadius: "50%", background: "rgba(212,175,90,0.12)" }} />
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", position: "relative" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          {onBack && (
            <button onClick={onBack} style={{ background: "rgba(255,255,255,0.14)", border: "none", borderRadius: 10, width: 32, height: 32, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0 }}>
              <ChevronLeft size={18} color="#fff" />
            </button>
          )}
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              {Icon && <Icon size={20} color={t.accent} />}
              <span style={{ color: "#fff", fontWeight: 800, fontSize: 20 }}>{title}</span>
            </div>
            {subtitle && <div style={{ color: "#C7D9D3", fontSize: 12.5, marginTop: 4 }}>{subtitle}</div>}
          </div>
        </div>
        {right}
      </div>
    </div>
  );
}

function Chip({ label, active, onClick, t, icon: Icon }) {
  return (
    <span onClick={onClick} style={{ display: "flex", alignItems: "center", gap: 5, padding: "7px 14px", borderRadius: 18, fontSize: 12.5, whiteSpace: "nowrap", cursor: "pointer", fontWeight: 700, background: active ? GRAD_GOLD(t) : t.surfaceAlt, color: active ? "#0F2A3D" : t.textDim, border: `1px solid ${active ? "transparent" : t.border}` }}>{Icon && <Icon size={13} />}{label}</span>
  );
}

        <BookOpen size={18} color="rgba(255,255,255,0.6)" />

      </div>

  );
}

function IconBtn({ icon, active, onClick, t, count }) {
  return <button onClick={onClick} style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", color: active ? t.accent : t.textDim, cursor: "pointer", padding: "6px 8px", borderRadius: 8, fontSize: 13, fontWeight: 600 }}>{icon}{count !== undefined && <span>{count}</span>}</button>;
}

function PostCard({ post, t, uid, onToggle, onToggleComments, onAddComment, onToggleShareMenu, onShareVia, onDelete, onEditSave, onReport, onBlock, onVotePoll }) {
  const [commentText, setCommentText] = React.useState("");

  const [editText, setEditText] = React.useState(post.text);

  const isOwn = post.authorId ? post.authorId === uid : post.author === "আপনার নাম";
  const submitComment = () => {
    if (!commentText.trim()) return;
    onAddComment(post.id, commentText);
    setCommentText("");
  };
  const saveEdit = () => { onEditSave(post.id, editText); setEditing(false); };
  return (
    <div style={{ background: t.surface, border: `1px solid ${t.border}`, borderRadius: 18, padding: 16, marginBottom: 14, boxShadow: "0 4px 14px rgba(0,0,0,0.06)", position: "relative" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          <Avatar label={post.avatar} t={t} ring />
          <div><div style={{ fontWeight: 700, fontSize: 15, color: t.text }}>{post.author}</div><div style={{ fontSize: 12, color: t.textDim }}>{post.time}{post.edited && " · সম্পাদিত"}</div></div>
        </div>
        <div style={{ position: "relative" }}>
          <MoreVertical size={18} color={t.textDim} style={{ cursor: "pointer" }} onClick={() => setMenuOpen(o => !o)} />
          {menuOpen && (
            <div style={{ position: "absolute", top: 24, right: 0, background: t.surface, border: `1px solid ${t.border}`, borderRadius: 12, boxShadow: "0 10px 24px rgba(0,0,0,0.2)", padding: 6, zIndex: 6, minWidth: 160 }}>
              {isOwn ? (
                <>
                  <div onClick={() => { setEditing(true); setMenuOpen(false); }} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", borderRadius: 8, cursor: "pointer", fontSize: 13, color: t.text }}><Edit3 size={15} color={t.accent} /> পোস্ট এডিট করুন</div>
                  <div onClick={() => { onDelete(post.id); setMenuOpen(false); }} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", borderRadius: 8, cursor: "pointer", fontSize: 13, color: t.danger }}><Trash2 size={15} /> পোস্ট ডিলিট করুন</div>
                </>
              ) : (
                <>
                  <div onClick={() => { setReported(true); onReport(post.id); setMenuOpen(false); }} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", borderRadius: 8, cursor: "pointer", fontSize: 13, color: t.text }}><Flag size={15} color={t.danger} /> রিপোর্ট করুন</div>
                  <div onClick={() => { onBlock(post.author); setMenuOpen(false); }} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", borderRadius: 8, cursor: "pointer", fontSize: 13, color: t.text }}><UserX size={15} color={t.textDim} /> ব্লক করুন</div>
                </>
              )}
            </div>
          )}
        </div>
      </div>

      {editing ? (
        <div style={{ margin: "12px 0" }}>
          <textarea value={editText} onChange={e => setEditText(e.target.value)} style={{ width: "100%", minHeight: 70, border: `1px solid ${t.border}`, borderRadius: 10, padding: 10, background: t.surfaceAlt, color: t.text, fontSize: 14, outline: "none", resize: "none", fontFamily: "inherit" }} />
          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>

            <button onClick={() => { setEditText(post.text); setEditing(false); }} style={{ padding: "6px 16px", borderRadius: 8, border: `1px solid ${t.border}`, background: "none", color: t.textDim, fontWeight: 700, fontSize: 12.5, cursor: "pointer" }}>বাতিল</button>
          </div>
        </div>
      ) : (
        <p style={{ color: t.text, fontSize: 14.5, lineHeight: 1.6, margin: "12px 0" }}>{post.text}</p>
      )}
      {reported && <div style={{ fontSize: 11.5, color: t.accent, marginBottom: 8 }}>✓ রিপোর্ট পাঠানো হয়েছে, ধন্যবাদ</div>}
      {post.type === "poll" && (
        <div style={{ background: t.surfaceAlt, border: `1px solid ${t.border}`, borderRadius: 14, padding: 12, marginBottom: 10 }}>
          <div style={{ fontSize: 13.5, fontWeight: 700, color: t.text, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}><BarChart3 size={15} color={t.accent} /> {post.pollQuestion}</div>
          {(() => {
            const total = post.pollOptions.reduce((s, o) => s + o.votes, 0) || 1;
            return post.pollOptions.map((o, i) => {
              const pct = Math.round((o.votes / total) * 100);
              const chosen = post.voted === i;
              return (
                <div key={i} onClick={() => post.voted === null && onVotePoll(post.id, i)} style={{ position: "relative", marginBottom: 8, borderRadius: 10, overflow: "hidden", border: `1px solid ${t.border}`, cursor: post.voted === null ? "pointer" : "default" }}>
                  {post.voted !== null && <div style={{ position: "absolute", inset: 0, width: `${pct}%`, background: chosen ? "rgba(212,175,90,0.35)" : "rgba(143,173,166,0.2)" }} />}
                  <div style={{ position: "relative", display: "flex", justifyContent: "space-between", padding: "8px 12px", fontSize: 13, color: t.text, fontWeight: chosen ? 800 : 500 }}>
                    <span>{o.text}{chosen && " ✓"}</span>
                    {post.voted !== null && <span>{pct}%</span>}

                </div>

      {post.type === "pdf" && (
        <div style={{ display: "flex", alignItems: "center", gap: 12, background: t.surfaceAlt, border: `1px solid ${t.border}`, borderRadius: 14, padding: 12, marginBottom: 10 }}>

          <div style={{ flex: 1 }}><div style={{ fontSize: 13.5, color: t.text, fontWeight: 600 }}>{post.fileName}</div><div style={{ fontSize: 12, color: t.textDim }}>{post.fileSize}</div></div>
          <Download size={18} color={t.accent} />
        </div>
      )}
      {post.type === "audio" && (
        <div style={{ display: "flex", alignItems: "center", gap: 12, background: t.surfaceAlt, border: `1px solid ${t.border}`, borderRadius: 14, padding: 12, marginBottom: 10 }}>
          <div style={{ width: 40, height: 40, borderRadius: "50%", background: GRAD(t), display: "flex", alignItems: "center", justifyContent: "center" }}><Play size={18} color="#fff" /></div>
          <div style={{ flex: 1, height: 4, background: t.border, borderRadius: 2 }}><div style={{ width: "35%", height: "100%", background: t.accent, borderRadius: 2 }} /></div>
          <span style={{ fontSize: 12, color: t.textDim }}>{post.duration}</span>
        </div>
      )}
      <div style={{ display: "flex", justifyContent: "space-between", paddingTop: 10, borderTop: `1px solid ${t.border}`, position: "relative" }}>
        <IconBtn t={t} active={post.liked} count={post.likes} icon={<Heart size={18} fill={post.liked ? t.accent : "none"} />} onClick={() => onToggle(post.id, "liked")} />
        <IconBtn t={t} active={post.commentsOpen} count={post.comments} icon={<MessageSquare size={18} />} onClick={() => onToggleComments(post.id)} />
        <IconBtn t={t} active={post.shareMenuOpen} count={post.shares} icon={<Share2 size={18} />} onClick={() => onToggleShareMenu(post.id)} />
        <IconBtn t={t} active={post.saved} icon={<Bookmark size={18} fill={post.saved ? t.accent : "none"} />} onClick={() => onToggle(post.id, "saved")} />

        {post.shareMenuOpen && (
          <div style={{ position: "absolute", bottom: 40, right: 40, background: t.surface, border: `1px solid ${t.border}`, borderRadius: 14, boxShadow: "0 10px 24px rgba(0,0,0,0.2)", padding: 8, zIndex: 5, minWidth: 170 }}>
            {[{ k: "chat", label: "চ্যাটে পাঠান", icon: MessageCircle }, { k: "copy", label: "লিংক কপি করুন", icon: FileText }, { k: "external", label: "অন্য অ্যাপে শেয়ার", icon: Share2 }].map(o => (
              <div key={o.k} onClick={() => onShareVia(post.id, o.k)} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", borderRadius: 8, cursor: "pointer", fontSize: 13, color: t.text }}>
                <o.icon size={15} color={t.accent} />{o.label}
              </div>
            ))}
          </div>
        )}
      </div>

      {post.commentsOpen && (
        <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${t.border}` }}>
          {post.commentsList.length === 0 && <div style={{ fontSize: 12.5, color: t.textDim, marginBottom: 8 }}>এখনো কোনো মন্তব্য নেই — প্রথম মন্তব্যটি করুন।</div>}
          {post.commentsList.map(c => (
            <div key={c.id} style={{ display: "flex", gap: 8, marginBottom: 8 }}>
              <Avatar label={c.author[0]} t={t} size={26} />
              <div style={{ background: t.surfaceAlt, borderRadius: 10, padding: "6px 10px", fontSize: 12.5, color: t.text }}>
                <span style={{ fontWeight: 700 }}>{c.author}: </span>{c.text}
              </div>
            </div>
          ))}
          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            <input value={commentText} onChange={e => setCommentText(e.target.value)} onKeyDown={e => e.key === "Enter" && submitComment()}

            <button onClick={submitComment} style={{ background: GRAD_GOLD(t), border: "none", borderRadius: "50%", width: 32, height: 32, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}><Send size={14} color="#0F2A3D" /></button>
          </div>
        </div>
      )}
    </div>
  );
}

  useEffect(() => {

      try {
        const { data, error } = await supabase.from("profiles").select("*").eq("id", userId).single();
        if (error) throw error;
        if (data) {
          // ব্যান করা ইউজার হলে সাথে সাথে লগআউট করে দেওয়া হয়, ভেতরে ঢুকতে দেওয়া হয় না
          if (data.banned) {
            await supabase.auth.signOut();
            setAuthError("আপনার অ্যাকাউন্ট বার বার নিয়ম ভাঙার কারণে ব্যান করা হয়েছে।");
            setUid(null);
            setLoggedIn(false);
            setAuthLoading(false);
            return;
          }
          setProfileName(data.name || "আপনার নাম");
          setProfileBio(data.bio || "");
          setProfilePic(data.photo_url || null);
          setCoverPic(data.cover_url || null);
          const { data: savedRows } = await supabase.from("post_saves").select("post_id").eq("user_id", userId);
          setSavedPostIds((savedRows || []).map((r) => r.post_id));
        }
      } catch (err) {
        console.error("প্রোফাইল লোড করতে সমস্যা:", err);
      }
      setUid(userId);
      setLoggedIn(true);
      setAuthLoading(false);
    };

    const { data: listener } = supabase.auth.onAuthStateChange((_event, session) => {
      if (session?.user) {
        loadProfile(session.user.id);
      } else {
        setUid(null);
        setLoggedIn(false);
        setAuthLoading(false);
      }
    });
    return () => listener.subscription.unsubscribe();
  }, []);
  const handleHeaderScroll = (e) => {
    const y = e.currentTarget.scrollTop;
    const last = lastScrollYRef.current;
    if (y > last + 8 && y > 80) setHeaderHidden(true);
    else if (y < last - 8) setHeaderHidden(false);
    lastScrollYRef.current = y;
  };

      if (error) { console.error("পোস্ট লোড করতে সমস্যা:", error); return; }

      setPosts((prev) => (postRows || []).map((row) => {

            {PRAYER_TIMES.map(p => (
              <div key={p.key} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 4px", borderBottom: `1px solid ${t.border}` }}>
                <span style={{ fontSize: 14.5, color: t.text, fontWeight: 600 }}>{p.name}</span>
                <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                  <span style={{ fontSize: 14.5, color: t.text, fontWeight: 800 }}>{p.time}</span>
                  <div onClick={() => togglePrayerReminder(p.key)} style={{ cursor: "pointer", display: "flex", alignItems: "center", gap: 5 }}>
                    {prayerReminders[p.key] ? <BellRing size={17} color={t.accent} /> : <BellOff size={17} color={t.textDim} />}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ===== পড়া চালিয়ে যান — প্যানেল ===== */}
      {showContinuePanel && (
        <div style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.6)", zIndex: 21, display: "flex", alignItems: "flex-end" }} onClick={() => setShowContinuePanel(false)}>
          <div onClick={e => e.stopPropagation()} style={{ background: t.surface, width: "100%", borderRadius: "22px 22px 0 0", padding: 18, maxHeight: "75%", display: "flex", flexDirection: "column" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <span style={{ fontSize: 17, fontWeight: 800, color: t.text, display: "flex", alignItems: "center", gap: 7 }}><Clock3 size={17} color={t.accent} /> {tr.continueReading}</span>
              <button onClick={() => setShowContinuePanel(false)} style={{ background: t.surfaceAlt, border: "none", borderRadius: "50%", width: 30, height: 30, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}><X size={16} color={t.text} /></button>
            </div>
            <div style={{ overflowY: "auto" }}>
              {Object.entries(readingProgress).map(([id, pct]) => findBook(Number(id))).filter(Boolean).map(b => (
                <div key={b.id} onClick={() => { setShowContinuePanel(false); openBook(b); }} style={{ display: "flex", gap: 12, alignItems: "center", background: t.surfaceAlt, border: `1px solid ${t.border}`, borderRadius: 16, padding: 10, marginBottom: 10, cursor: "pointer" }}>
                  <div style={{ width: 46, height: 60, borderRadius: 10, background: `linear-gradient(160deg, ${b.color}, #0A1B2E)`, flexShrink: 0 }} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 13.5, fontWeight: 700, color: t.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{b.title}</div>
                    <div style={{ fontSize: 11.5, color: t.textDim, margin: "2px 0 6px" }}>{b.author} · {Math.round((readingProgress[b.id] / 100) * b.pages)}/{b.pages} পাতা</div>
                    <div style={{ height: 5, background: t.border, borderRadius: 3 }}><div style={{ width: `${readingProgress[b.id]}%`, height: "100%", background: GRAD_GOLD(t), borderRadius: 3 }} /></div>
                  </div>
                  <span style={{ fontSize: 11.5, color: t.accent, fontWeight: 800 }}>{readingProgress[b.id]}%</span>
                  {downloadedBooks.includes(b.id) && <WifiOff size={14} color={t.textDim} />}
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* ===== PDF রিডার ===== */}
      {readerBook && (
        <div style={{ position: "absolute", inset: 0, background: t.bg, zIndex: 30, display: "flex", flexDirection: "column" }}>
          <div style={{ background: GRAD(t), padding: "14px 16px", display: "flex", alignItems: "center", gap: 10, borderRadius: "0 0 20px 20px" }}>
            <button onClick={closeReader} style={{ background: "rgba(255,255,255,0.14)", border: "none", borderRadius: 10, width: 32, height: 32, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0 }}><ChevronLeft size={18} color="#fff" /></button>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ color: "#fff", fontWeight: 700, fontSize: 14.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{readerBook.title}</div>
              <div style={{ color: "#C7D9D3", fontSize: 11.5 }}>{readerBook.author}</div>
            </div>
            <button onClick={() => toggleDownload(readerBook.id)} style={{ background: downloadedBooks.includes(readerBook.id) ? GRAD_GOLD(t) : "rgba(255,255,255,0.14)", border: "none", borderRadius: 10, width: 36, height: 32, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0 }}>
              {downloadedBooks.includes(readerBook.id) ? <CheckCircle2 size={16} color="#0F2A3D" /> : <Download size={16} color="#fff" />}
            </button>
          </div>

          {downloadedBooks.includes(readerBook.id) && (
            <div style={{ display: "flex", alignItems: "center", gap: 6, justifyContent: "center", padding: "8px 0", background: t.surfaceAlt, borderBottom: `1px solid ${t.border}` }}>
              <WifiOff size={13} color={t.accent} /><span style={{ fontSize: 11.5, color: t.textDim }}>ডাউনলোড হয়ে গেছে — এখন অফলাইনেও পড়া যাবে</span>
            </div>
          )}

          <div style={{ display: "flex", gap: 8, padding: "10px 16px 0" }}>
            <button onClick={() => setAudioPlaying(p => !p)} style={{
              flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "8px 0", borderRadius: 10, border: `1px solid ${t.border}`, cursor: "pointer",
              background: audioPlaying ? GRAD_GOLD(t) : t.surface, color: audioPlaying ? "#0F2A3D" : t.text, fontSize: 12, fontWeight: 700
            }}>
              <Headphones size={14} /> {audioPlaying ? "অডিও চলছে..." : "অডিওবুক হিসেবে শুনুন"}
            </button>
            <button onClick={() => setShowReviews(true)} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "8px 0", borderRadius: 10, border: `1px solid ${t.border}`, background: t.surface, color: t.text, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
              <Star size={14} color={t.accent} /> রিভিউ ও রেটিং ({(bookReviews[readerBook.id] || []).length})
            </button>
          </div>

          {audioPlaying && (
            <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 16px 0" }}>
              <PauseCircle size={22} color={t.accent} onClick={() => setAudioPlaying(false)} style={{ cursor: "pointer" }} />
              <div style={{ flex: 1, height: 4, background: t.border, borderRadius: 2 }}>
                <div style={{ width: `${Math.min(100, (audioSeconds % 60) * 1.6)}%`, height: "100%", background: GRAD_GOLD(t), borderRadius: 2 }} />
              </div>
              <span style={{ fontSize: 11, color: t.textDim, minWidth: 34 }}>{Math.floor(audioSeconds / 60)}:{(audioSeconds % 60).toString().padStart(2, "0")}</span>
            </div>
          )}

          {/* পাতার এলাকা */}
          <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: 20, overflow: "hidden" }}>
            <div style={{
              width: "100%", maxWidth: 300, aspectRatio: "3/4", background: t.surface, borderRadius: 12, boxShadow: "0 12px 30px rgba(0,0,0,0.25)",
              border: `1px solid ${t.border}`, padding: 22, display: "flex", flexDirection: "column", gap: 9
            }}>
              <div style={{ fontSize: 11, color: t.textDim, textAlign: "center", marginBottom: 6 }}>— পাতা {readerPage} —</div>
              {Array.from({ length: 11 }).map((_, i) => (
                <div key={i} style={{ height: 7, borderRadius: 3, background: t.border, width: i % 3 === 2 ? "70%" : "100%" }} />
              ))}
            </div>
          </div>

          {/* নিচের নিয়ন্ত্রণ */}
          <div style={{ padding: "10px 16px 16px", background: t.surface, borderTop: `1px solid ${t.border}` }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
              <span style={{ fontSize: 11, color: t.textDim, minWidth: 60 }}>পাতা {readerPage}/{readerBook.pages}</span>
              <div style={{ flex: 1, height: 5, background: t.border, borderRadius: 3 }}>
                <div style={{ width: `${Math.round((readerPage / readerBook.pages) * 100)}%`, height: "100%", background: GRAD_GOLD(t), borderRadius: 3 }} />
              </div>
              <span style={{ fontSize: 11, color: t.accent, fontWeight: 800, minWidth: 30, textAlign: "right" }}>{Math.round((readerPage / readerBook.pages) * 100)}%</span>
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={() => turnPage(-5)} disabled={readerPage <= 1} style={{ flex: 1, padding: 11, borderRadius: 12, border: `1px solid ${t.border}`, background: t.surfaceAlt, color: t.text, fontWeight: 700, fontSize: 13, cursor: readerPage <= 1 ? "default" : "pointer", opacity: readerPage <= 1 ? 0.5 : 1 }}>◀ পেছনে</button>
              <button onClick={() => turnPage(5)} disabled={readerPage >= readerBook.pages} style={{ flex: 1, padding: 11, borderRadius: 12, border: "none", background: GRAD_GOLD(t), color: "#0F2A3D", fontWeight: 800, fontSize: 13, cursor: readerPage >= readerBook.pages ? "default" : "pointer", opacity: readerPage >= readerBook.pages ? 0.5 : 1 }}>সামনে ▶</button>
            </div>
            <div style={{ fontSize: 11, color: t.textDim, textAlign: "center", marginTop: 10 }}>বন্ধ করলে এই জায়গা থেকেই পরে আবার শুরু হবে</div>
          </div>
        </div>
      )}

      {/* ===== পোস্ট তৈরি করার মডাল ===== */}
      {showCreatePost && (
        <div style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.6)", zIndex: 20, display: "flex", alignItems: "flex-end" }}>
          <div style={{ background: t.surface, width: "100%", borderRadius: "22px 22px 0 0", padding: 18, maxHeight: "80%", display: "flex", flexDirection: "column" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <span style={{ fontSize: 17, fontWeight: 800, color: t.text }}>{tr.newPost}</span>
              <button onClick={() => { setShowCreatePost(false); setNewPostText(""); setNewPostType(null); }} style={{ background: t.surfaceAlt, border: "none", borderRadius: "50%", width: 30, height: 30, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}><X size={16} color={t.text} /></button>
            </div>
            <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 12 }}>
              <Avatar label="আ" t={t} size={38} ring />
              <span style={{ fontWeight: 700, fontSize: 14, color: t.text }}>আপনার নাম</span>
            </div>
            <textarea value={newPostText} onChange={e => setNewPostText(e.target.value)} placeholder={tr.postPlaceholder}
              style={{ width: "100%", minHeight: 100, border: `1px solid ${t.border}`, borderRadius: 12, padding: 12, background: t.surfaceAlt, color: t.text, fontSize: 14, outline: "none", resize: "none", fontFamily: "inherit" }} />

            {newPostType && (
              <div style={{ display: "flex", alignItems: "center", gap: 10, background: t.surfaceAlt, border: `1px solid ${t.border}`, borderRadius: 12, padding: 10, marginTop: 10 }}>
                {newPostType === "image" && <ImageIcon size={18} color={t.accent} />}
                {newPostType === "video" && <Video size={18} color={t.accent} />}
                {newPostType === "pdf" && <FileText size={18} color={t.danger} />}
                {newPostType === "audio" && <Mic2 size={18} color={t.accent} />}
                <span style={{ fontSize: 13, color: t.text, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                  {newPostFile ? newPostFile.name : (
                    <>{newPostType === "image" && "ছবি সংযুক্ত হবে"}{newPostType === "video" && "ভিডিও সংযুক্ত হবে"}
                    {newPostType === "pdf" && "PDF ডকুমেন্ট সংযুক্ত হবে"}{newPostType === "audio" && "অডিও সংযুক্ত হবে"}</>
                  )}
                </span>
                {!newPostFile && <Upload size={15} color={t.accent} style={{ cursor: "pointer" }} onClick={() => fileInputRef.current?.click()} />}
                <X size={15} color={t.textDim} style={{ cursor: "pointer" }} onClick={() => { setNewPostType(null); setNewPostFile(null); }} />
              </div>
            )}
            {newPostType && newPostFile?.dataUrl && (
              <img src={newPostFile.dataUrl} alt="" style={{ width: "100%", maxHeight: 150, objectFit: "cover", borderRadius: 10, marginTop: 8 }} />
            )}
            <input ref={fileInputRef} type="file" style={{ display: "none" }}
              accept={newPostType === "image" ? "image/*" : newPostType === "video" ? "video/*" : newPostType === "audio" ? "audio/*" : ".pdf"}
              onChange={(e) => {
                const file = e.target.files[0];
                if (!file) return;
                const sizeLabel = file.size > 1024 * 1024 ? `${(file.size / (1024 * 1024)).toFixed(1)} MB` : `${Math.round(file.size / 1024)} KB`;
                if (newPostType === "image") {
                  const reader = new FileReader();
                  reader.onload = () => setNewPostFile({ name: file.name, sizeLabel, dataUrl: reader.result, file });
                  reader.readAsDataURL(file);
                } else {
                  setNewPostFile({ name: file.name, sizeLabel, file });
                }
              }} />

            <div style={{ display: "flex", gap: 8, marginTop: 14, marginBottom: 16 }}>
              {[{ key: "image", icon: ImageIcon, label: "ছবি" }, { key: "video", icon: Video, label: "ভিডিও" }, { key: "pdf", icon: FileText, label: "PDF" }, { key: "audio", icon: Mic2, label: "অডিও" }].map(o => (
                <div key={o.key} onClick={() => { setNewPostType(newPostType === o.key ? null : o.key); setNewPostFile(null); if (newPostType !== o.key) setTimeout(() => fileInputRef.current?.click(), 50); }} style={{
                  flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 5, padding: "10px 4px", borderRadius: 12, cursor: "pointer",
                  background: newPostType === o.key ? GRAD_GOLD(t) : t.surfaceAlt, border: `1px solid ${newPostType === o.key ? "transparent" : t.border}`
                }}>
                  <o.icon size={18} color={newPostType === o.key ? "#0F2A3D" : t.textDim} />
                  <span style={{ fontSize: 11, fontWeight: 700, color: newPostType === o.key ? "#0F2A3D" : t.textDim }}>{o.label}</span>
                </div>
              ))}
            </div>

            <button onClick={submitPost} disabled={(!newPostText.trim() && !newPostType) || postSubmitting} style={{
              width: "100%", padding: 13, borderRadius: 12, border: "none", fontWeight: 800, fontSize: 15, cursor: ((!newPostText.trim() && !newPostType) || postSubmitting) ? "default" : "pointer",
              background: ((!newPostText.trim() && !newPostType) || postSubmitting) ? t.border : GRAD_GOLD(t), color: ((!newPostText.trim() && !newPostType) || postSubmitting) ? t.textDim : "#0F2A3D"
            }}>{postSubmitting ? "পোস্ট হচ্ছে..." : tr.submitPost}</button>
          </div>
        </div>
      )}
    </div>
  );
}


const root = createRoot(document.getElementById("root"));
root.render(<App />);
    </script>
  </body>
</html>
